name: Atualizar cardápio do RU

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - "build.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
  schedule:
    - cron: "0 9 * * *"    # 06:00 Brasília
    - cron: "0 15 * * *"   # 12:00 Brasília
    - cron: "0 23 * * 0"   # dom, 20:00 Brasília: virada para a semana nova
                           # (o cardápio de domingo vale até 19h30, quando
                           # fecha a entrada do RU)
  workflow_dispatch: {}     # execução manual

permissions:
  contents: write   # commitar os JSONs atualizados de volta no repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # não cancelar uma coleta de dados em andamento

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o commit de dados pode
                           # precisar de rebase sobre um push manual

      # Decide o que este evento precisa fazer, para não raspar o ru.unb.br
      # (e não publicar) sem necessidade:
      #   - push que mexeu SÓ em site/**: nada de scraping, só deploy;
      #   - push que mexeu em código/config: raspa e publica se os dados mudarem;
      #   - cron/dispatch: raspa e publica só quando há dado novo.
      - name: Planejar a execução
        id: plan
        shell: bash
        run: |
          set -uo pipefail
          scrape=true
          deploy=true
          if [ "${{ github.event_name }}" = "push" ]; then
            # Compara com o HEAD anterior do remoto (event.before), não com
            # HEAD^: um push com vários commits de uma vez precisa enxergar
            # TODOS os arquivos alterados, não só os do último commit.
            base="${{ github.event.before }}"
            case "$base" in
              ""|0000000000000000000000000000000000000000) base="" ;;
            esac
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
            files=$(git diff --name-only "$base" "HEAD" 2>/dev/null || true)
            echo "Arquivos alterados desde $base:"
            printf '%s\n' "$files"
            only_site=true
            has_site=false
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                site/*) has_site=true ;;
                *)      only_site=false ;;
              esac
            done <<< "$files"
            # push exclusivamente do site: os JSONs já vieram no próprio push
            if [ "$only_site" = "true" ]; then scrape=false; fi
            # push sem nada em site/: só publica se a coleta mudar os dados
            if [ "$has_site" = "false" ]; then deploy=false; fi
          fi
          echo "scrape=$scrape" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "scrape=$scrape deploy=$deploy"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes do extrator
        run: python -m pytest

      - name: Buscar cardápio da semana
        if: steps.plan.outputs.scrape == 'true'
        run: python scripts/fetch_cardapio.py

      - name: Publicar dados no site
        if: steps.plan.outputs.scrape == 'true'
        run: python build.py

      # Sem coleta (push só de site/**) ainda validamos os JSONs: um arquivo
      # sem dias não pode ir para o ar, e o build.py restaura a versão do git.
      - name: Validar os JSONs versionados
        if: steps.plan.outputs.scrape != 'true'
        run: python build.py

      # Os JSONs só mudam quando o cardápio muda de verdade: o
      # fetch_cardapio.py preserva o generated_at quando o conteúdo é igual,
      # então `git diff --cached --quiet` consegue ser verdadeiro e o cron
      # deixa de gerar commits que só alteram o timestamp.
      - name: Commitar dados atualizados no repo
        id: commit
        if: steps.plan.outputs.scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --cached --quiet; then
            echo "Nenhum dado alterado — nada a commitar"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Dados do cardápio atualizados automaticamente [skip ci]"
            # um push manual na main durante a coleta não pode quebrar o cron
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publica quando o site mudou no push OU quando a coleta trouxe dado
      # novo. Cron sem novidade não gera deploy (economiza minutos e evita
      # reescrever o Pages sem motivo).
      - name: Configurar Pages
        if: steps.plan.outputs.deploy == 'true' || steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload do site
        if: steps.plan.outputs.deploy == 'true' || steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy no GitHub Pages
        id: deployment
        if: steps.plan.outputs.deploy == 'true' || steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
