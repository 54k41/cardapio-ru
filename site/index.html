<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cardápio RU · Restaurante Universitário da UnB</title>
  <meta name="description" content="Cardápio semanal do Restaurante Universitário da UnB – todos os campi e Executivo, atualizado automaticamente dos PDFs oficiais.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231d4ed8'/><text x='16' y='22' font-family='system-ui,sans-serif' font-size='13' font-weight='600' text-anchor='middle' fill='%23fff'>RU</text></svg>">
  <link rel="stylesheet" href="styles.css?v=20261112">
</head>
<body>
  <a class="skip-link" href="#menu-card">Ir para o cardápio</a>

  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">RU</span>
        <div class="brand-text">
          <h1>Cardápio RU</h1>
          <p class="brand-sub">Restaurante Universitário · UnB</p>
        </div>
      </div>
      <label class="campus-wrap">
        <span class="visually-hidden">Campus</span>
        <select id="campus-select" aria-label="Selecionar campus">
          <option value="darcy">Darcy Ribeiro</option>
          <option value="executivo">Executivo</option>
          <option value="fcts">Ceilândia · FCTS</option>
          <option value="fcte">Gama · FCTE</option>
          <option value="fup">Planaltina · FUP</option>
          <option value="fal">FAL · Fazenda</option>
        </select>
      </label>
    </div>
    <p id="status-banner" class="status-banner" role="status" hidden></p>
  </header>

  <nav class="week-nav" aria-label="Escolha do dia">
    <button type="button" class="week-step" id="week-prev" hidden aria-label="Semana anterior">‹</button>
    <div class="day-tabs" id="day-tabs" role="tablist" aria-label="Dias da semana"></div>
    <button type="button" class="week-step" id="week-next" hidden aria-label="Próxima semana">›</button>
  </nav>
  <p class="week-label" id="week-label" hidden></p>

  <main class="container">
    <div class="meal-switch" id="meal-tabs" role="tablist" aria-label="Refeições">
      <button type="button" role="tab" data-meal="principal" id="tab-principal" hidden aria-selected="false" aria-controls="menu-card">Cardápio</button>
      <button type="button" role="tab" data-meal="cafe" id="tab-cafe" aria-selected="false" aria-controls="menu-card">Café</button>
      <button type="button" role="tab" data-meal="almoco" id="tab-almoco" aria-selected="true" aria-controls="menu-card">Almoço</button>
      <button type="button" role="tab" data-meal="jantar" id="tab-jantar" aria-selected="false" aria-controls="menu-card">Jantar</button>
    </div>

    <div class="diet-switch" id="diet-switch" role="group" aria-label="Preferência alimentar" hidden>
      <button type="button" class="diet-chip" data-diet="padrao" aria-pressed="true">Padrão</button>
      <button type="button" class="diet-chip" data-diet="ovolacto" aria-pressed="false">Ovolacto</button>
      <button type="button" class="diet-chip" data-diet="estrito" aria-pressed="false">Estrito</button>
    </div>

    <section id="menu-card" class="menu-card" role="tabpanel" tabindex="-1" aria-live="polite" aria-label="Cardápio do dia"></section>

    <footer class="page-footer">
      <p id="updated-at"></p>
      <p class="disclaimer">Cardápio sujeito a alterações · Fonte oficial:
        <a href="https://ru.unb.br/cardapio/" target="_blank" rel="noopener">ru.unb.br/cardapio</a>
        · <a id="source-link" href="#" target="_blank" rel="noopener" hidden>PDF oficial</a></p>
    </footer>
  </main>

  <script src="app.js?v=20261112"></script>
</body>
</html>
