<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio RU · Darcy Ribeiro</title>
  <meta name="description" content="Cardápio do Restaurante Universitário da UnB – Campus Darcy Ribeiro, atualizado automaticamente do PDF oficial.">
  <meta name="theme-color" content="#1e40af">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">🍽️</span>
        <div>
          <h1>Cardápio RU</h1>
          <label class="campus-wrap">
            <select id="campus-select" aria-label="Selecionar campus">
              <option value="darcy">Darcy Ribeiro · UnB</option>
              <option value="executivo">Executivo</option>
              <option value="fcts">Ceilândia · FCTS</option>
              <option value="fcte">Gama · FCTE</option>
              <option value="fup">Planaltina · FUP</option>
              <option value="fal">FAL</option>
            </select>
          </label>
        </div>
      </div>
      <a id="source-link" class="source-link" href="#" target="_blank" rel="noopener" hidden>
        <span>PDF oficial</span><span class="arrow">↗</span>
      </a>
    </div>
    <p id="status-banner" class="status-banner" hidden></p>
  </header>

  <nav class="day-tabs" id="day-tabs" aria-label="Dias da semana"></nav>

  <main class="container">
    <section class="meal-switch" role="tablist" aria-label="Refeições">
      <button role="tab" data-meal="principal" hidden><span class="meal-ico">🍽️</span><span class="long">Cardápio</span><span class="short">Cardápio</span></button>
      <button role="tab" data-meal="cafe"><span class="meal-ico">☕</span><span class="long">Café da manhã</span><span class="short">Café</span></button>
      <button role="tab" data-meal="almoco" class="active"><span class="meal-ico">🍛</span><span class="long">Almoço</span><span class="short">Almoço</span></button>
      <button role="tab" data-meal="jantar"><span class="meal-ico">🌙</span><span class="long">Jantar</span><span class="short">Jantar</span></button>
    </section>

    <section id="menu-card" class="menu-card" aria-live="polite"></section>

    <footer class="page-footer">
      <p id="updated-at"></p>
      <p class="disclaimer">Cardápio sujeito a alterações · Fonte oficial:
        <a href="https://ru.unb.br/cardapio/" target="_blank" rel="noopener">ru.unb.br/cardapio</a></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
